baseURL = 'https://blog.cunghuynh.id.vn/'
locale = 'vi-vn'
title = 'Blog của Cung'
theme = 'PaperMod'

enableGitInfo = true
defaultContentLanguage = 'vi'
defaultContentLanguageInSubdir = false # Vietnamese in root /, English in /en/

[frontmatter]
  lastmod = [':git', 'lastmod', 'date', 'publishDate']

[languages]
  [languages.vi]
    languageCode = 'vi-vn'
    languageName = 'Tiếng Việt'
    weight = 1
    title = 'Blog của Cung'
    [languages.vi.params]
      description = 'Góc chia sẻ của Cung Huỳnh về Toán học, Lập trình và Cuộc sống'

    [languages.vi.menu]
      [[languages.vi.menu.main]]
        identifier = "science"
        name = "Khoa học"
        url = "#"
        weight = 10

      [[languages.vi.menu.main]]
        identifier = "math"
        name = "Toán học"
        parent = "science"
        url = "categories/toán-học/"
        weight = 10

      [[languages.vi.menu.main]]
        identifier = "physics"
